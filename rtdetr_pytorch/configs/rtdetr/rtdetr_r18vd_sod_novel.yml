__include__: [
  'include/rtdetr_r18vd.yml',
  '../dataset/coco_detection.yml',
  '../runtime.yml',
  'include/dataloader.yml',
  'include/optimizer_r18.yml'
]

# -----------------------------------------------------------------
# "Novel Coord-gnConv" Configuration for SOD
# -----------------------------------------------------------------
output_dir: ./output/rtdetr_r18vd_sod_novel
epochs: 100
num_classes: 10

PResNet:
  return_idx: [0, 1, 2, 3] # P2, P3, P4, P5

# Use the NEW Novel CoordGnConv Encoder
HybridEncoderNovelCoordGnConv:
  in_channels: [64, 128, 256, 512]
  feat_strides: [4, 8, 16, 32]
  hidden_dim: 256
  use_encoder_idx: [3]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.
  enc_act: 'gelu'
  expansion: 1.0
  depth_mult: 1.0
  act: 'silu'
  reduction: 4  # Coordinate reduction ratio

RTDETRTransformer:
  feat_channels: [256, 256, 256, 256]
  feat_strides: [4, 8, 16, 32]
  hidden_dim: 256
  num_levels: 4
  num_queries: 300
  num_decoder_layers: 6
  num_denoising: 100
  eval_idx: -1
  eval_spatial_size: [640, 640]

RTDETR:
  backbone: PResNet
  encoder: HybridEncoderNovelCoordGnConv
  decoder: RTDETRTransformer
  multi_scale: [480, 512, 544, 576, 608, 640, 672, 704, 736, 768, 800]
